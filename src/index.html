<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI能力测评智能体登录入口，学生端与教师端统一登录。">
  <title>AI能力测评智能体</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="mode-student">
  <div class="bg bg-student" aria-hidden="true"></div>
  <div class="bg bg-teacher" aria-hidden="true"></div>

  <div class="page">
    <header class="topbar">
      <a class="brand" href="#" aria-label="AI能力测评智能体首页">
        <span class="brand-mark" data-icon="Brain"></span>
        <span class="brand-copy">
          <strong>AI能力测评</strong>
          <span>AI Capability Assessment</span>
        </span>
      </a>
      <div class="topbar-right">
        <button class="text-btn" type="button" id="ssoTopButton">
          <span data-icon="School"></span>
          <span>统一认证</span>
        </button>
        <button class="icon-btn" type="button" data-icon="CircleHelp" aria-label="帮助"></button>
      </div>
    </header>

    <main class="portal">
      <section class="showcase" aria-label="平台入口">
        <div class="student-show">
          <div class="scene-card">
            <div class="scene-art">
              <svg class="explorer-character" viewBox="0 0 340 360" role="img" aria-label="AI 能力探索者插画">
                <ellipse cx="170" cy="336" rx="96" ry="13" fill="rgba(4,3,24,.38)"/>
                <g class="char-legs">
                  <rect x="138" y="238" width="26" height="76" rx="13" fill="#2c2566"/>
                  <rect x="176" y="238" width="26" height="76" rx="13" fill="#2c2566"/>
                  <ellipse cx="151" cy="317" rx="20" ry="9" fill="#ff7a93"/>
                  <ellipse cx="189" cy="317" rx="20" ry="9" fill="#ff7a93"/>
                </g>
                <g class="char-backpack">
                  <rect x="88" y="174" width="42" height="80" rx="14" fill="#17bcdc"/>
                  <rect x="93" y="190" width="32" height="19" rx="8" fill="#0e9ec0"/>
                  <rect x="93" y="215" width="32" height="19" rx="8" fill="#ffd166"/>
                  <path d="M118 182c6 8 10 16 10 24v20c0-14 6-24 16-32z" fill="#0e9ec0" opacity=".7"/>
                </g>
                <g class="char-torso">
                  <rect x="116" y="160" width="108" height="106" rx="30" fill="#6d5ae8"/>
                  <path d="M116 206h108" stroke="#5a48d1" stroke-width="10"/>
                  <rect x="150" y="206" width="40" height="30" rx="9" fill="#3f2fa8"/>
                  <circle cx="163" cy="221" r="4" fill="#ffd166"/>
                  <circle cx="177" cy="221" r="4" fill="#22d3ee"/>
                  <path d="M146 164c8-7 16-7 24 0 8-7 16-7 24 0l-6 22c-4 3-8 3-12 0-4 3-8 3-12 0-4 3-8 3-12 0z" fill="#f8faff" opacity=".92"/>
                </g>
                <g class="char-arms">
                  <path d="M126 180c-22 7-34 22-37 45" stroke="#6d5ae8" stroke-width="21" stroke-linecap="round" fill="none"/>
                  <path d="M214 180c22 7 34 22 37 45" stroke="#6d5ae8" stroke-width="21" stroke-linecap="round" fill="none"/>
                  <circle cx="89" cy="229" r="11" fill="#f6cfae"/>
                  <circle cx="251" cy="229" r="11" fill="#f6cfae"/>
                </g>
                <g class="char-head">
                  <rect x="126" y="84" width="88" height="84" rx="32" fill="#f6cfae"/>
                  <path d="M126 114c0-26 20-40 44-40s44 14 44 40v-8c0-20-16-32-44-32s-44 12-44 32z" fill="#3a2a7d"/>
                  <path d="M170 86l-3-14" stroke="#241d52" stroke-width="5" stroke-linecap="round"/>
                  <circle cx="166" cy="69" r="5" fill="#ffd166"/>
                  <circle cx="152" cy="140" r="5.5" fill="#211b4a"/>
                  <circle cx="188" cy="140" r="5.5" fill="#211b4a"/>
                  <circle cx="154" cy="138" r="1.8" fill="#ffffff"/>
                  <circle cx="190" cy="138" r="1.8" fill="#ffffff"/>
                  <ellipse cx="141" cy="155" rx="7" ry="4" fill="#ff9fb0" opacity=".55"/>
                  <ellipse cx="199" cy="155" rx="7" ry="4" fill="#ff9fb0" opacity=".55"/>
                  <path d="M162 153c4 5 12 5 16 0" stroke="#8a5136" stroke-width="3.5" stroke-linecap="round" fill="none"/>
                </g>
                <g class="char-drone">
                  <rect x="252" y="118" width="36" height="36" rx="11" fill="#22d3ee"/>
                  <rect x="259" y="125" width="22" height="22" rx="7" fill="#0b1023"/>
                  <circle cx="270" cy="136" r="4.5" fill="#22d3ee"/>
                  <path d="M252 118l-9-13M288 118l9-13M252 154l-9 13M288 154l9 13" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
                </g>
                <g class="char-sparkles">
                  <path d="M62 92l3.2 8.8 8.8 3.2-8.8 3.2-3.2 8.8-3.2-8.8-8.8-3.2 8.8-3.2z" fill="#ffd166"/>
                  <path d="M278 74l2.4 6.6 6.6 2.4-6.6 2.4-2.4 6.6-2.4-6.6-6.6-2.4 6.6-2.4z" fill="#22d3ee"/>
                  <path d="M52 220l2 5.5 5.5 2-5.5 2-2 5.5-2-5.5-5.5-2 5.5-2z" fill="#9b6cff"/>
                </g>
              </svg>

              <div class="float-chip chip-a">
                <span class="chip-ico" style="--chip:#0ecf8e" data-icon="WandSparkles"></span>
                <span class="chip-ico" style="--chip:#22d3ee" data-icon="MessagesSquare"></span>
                <span class="chip-ico" style="--chip:#ff6b7a" data-icon="Wrench"></span>
              </div>
              <div class="float-ring ring-a"></div>
              <div class="float-ring ring-b"></div>
              <div class="float-line line-a"></div>
              <div class="float-line line-b"></div>
            </div>

            <div class="entry-grid">
              <a class="entry-card student-entry" href="student.html">
                <span class="entry-icon" data-icon="GraduationCap"></span>
                <span class="entry-copy">
                  <strong>学生端</strong>
                  <span>立即体验</span>
                </span>
                <span class="entry-arrow" data-icon="ArrowRight"></span>
              </a>
              <a class="entry-card teacher-entry" href="teacher.html">
                <span class="entry-icon" data-icon="Presentation"></span>
                <span class="entry-copy">
                  <strong>教师端</strong>
                  <span>立即体验</span>
                </span>
                <span class="entry-arrow" data-icon="ArrowRight"></span>
              </a>
            </div>
          </div>
        </div>

        <div class="teacher-show">
          <div class="dash-card">
            <div class="teacher-art">
              <div class="art-ring art-ring-a"></div>
              <div class="art-ring art-ring-b"></div>
              <div class="art-bar art-bar-1"></div>
              <div class="art-bar art-bar-2"></div>
              <div class="art-bar art-bar-3"></div>
              <div class="art-dot"></div>
            </div>
            <div class="entry-grid">
              <a class="entry-card teacher-entry" href="teacher.html">
                <span class="entry-icon" data-icon="Presentation"></span>
                <span class="entry-copy">
                  <strong>教师端</strong>
                  <span>进入数据中心</span>
                </span>
                <span class="entry-arrow" data-icon="ArrowRight"></span>
              </a>
              <a class="entry-card student-entry" href="student.html">
                <span class="entry-icon" data-icon="GraduationCap"></span>
                <span class="entry-copy">
                  <strong>学生端</strong>
                  <span>进入探索空间</span>
                </span>
                <span class="entry-arrow" data-icon="ArrowRight"></span>
              </a>
            </div>
          </div>
        </div>
      </section>

      <section class="auth-side" aria-label="账号登录">
        <div class="auth-card">
          <div class="role-switch" role="tablist" aria-label="选择登录身份">
            <button class="role-tab active" type="button" role="tab" aria-selected="true" data-role="student">
              <span data-icon="GraduationCap"></span>
              学生端
            </button>
            <button class="role-tab" type="button" role="tab" aria-selected="false" data-role="teacher">
              <span data-icon="Presentation"></span>
              教师端
            </button>
          </div>

          <div class="auth-head" aria-live="polite">
            <p class="eyebrow" id="authEyebrow">欢迎回来</p>
            <h1 id="authTitle">开始探索 AI 能力</h1>
            <p class="auth-sub" id="authSub">登录后进入对应空间</p>
          </div>

          <form id="loginForm" novalidate>
            <div class="field-group">
              <label class="field-label" for="username">账号</label>
              <div class="field" id="usernameField">
                <span class="field-icon" data-icon="User"></span>
                <input id="username" name="username" type="text" autocomplete="username" placeholder="学号 / 邮箱" required>
              </div>
              <p class="field-error" id="usernameError" role="alert"></p>
            </div>

            <div class="field-group">
              <div class="label-row">
                <label class="field-label" for="password">密码</label>
                <a class="forgot-link" href="#">忘记密码？</a>
              </div>
              <div class="field" id="passwordField">
                <span class="field-icon" data-icon="LockKeyhole"></span>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入登录密码" required>
                <button class="password-toggle" type="button" data-icon="Eye" aria-label="显示密码"></button>
              </div>
              <p class="field-error" id="passwordError" role="alert"></p>
            </div>

            <div class="form-meta">
              <label class="checkbox">
                <input type="checkbox" id="remember" checked>
                <span class="checkmark" data-icon="Check"></span>
                <span>记住我</span>
              </label>
              <span class="secure-note">
                <span data-icon="ShieldCheck"></span>
                加密传输
              </span>
            </div>

            <button class="submit-btn" type="submit" id="submitButton">
              <span class="btn-label">进入学生端</span>
              <span class="btn-icon" data-icon="ArrowRight"></span>
              <span class="spinner" hidden></span>
            </button>

            <div class="divider"><span>或</span></div>

            <button class="sso-btn" type="button" id="ssoButton">
              <span data-icon="School"></span>
              <span>使用学校统一身份登录</span>
            </button>

            <div class="register-row">
              <span>还没有账号？</span>
              <button class="link-btn" type="button" id="registerLink">立即注册</button>
            </div>
          </form>

          <div class="demo-bar">
            <span class="demo-label">演示账号</span>
            <button class="demo-btn" type="button" data-fill="student">
              <span data-icon="GraduationCap"></span>
              学生 student / 123456
            </button>
            <button class="demo-btn" type="button" data-fill="teacher">
              <span data-icon="Presentation"></span>
              教师 teacher / 123456
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer class="page-foot">
      <span>AI 能力测评智能体</span>
      <span>学生端与教师端权限分离 · 数据加密存储</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <div class="success-overlay" id="successOverlay" role="dialog" aria-modal="true" aria-labelledby="successTitle" hidden>
    <div class="success-card">
      <div class="burst" aria-hidden="true">
        <span class="burst-star" style="--x:-92px;--y:-70px;--rot:120deg;--delay:0ms;--color:#ff6b7a"></span>
        <span class="burst-star" style="--x:88px;--y:-64px;--rot:-80deg;--delay:60ms;--color:#ffd166"></span>
        <span class="burst-star" style="--x:-70px;--y:74px;--rot:200deg;--delay:110ms;--color:#0ecf8e"></span>
        <span class="burst-star" style="--x:76px;--y:82px;--rot:-220deg;--delay:150ms;--color:#22d3ee"></span>
        <span class="burst-star" style="--x:14px;--y:-110px;--rot:40deg;--delay:40ms;--color:#9b6cff"></span>
        <span class="burst-star" style="--x:-16px;--y:112px;--rot:300deg;--delay:90ms;--color:#5b6cf6"></span>
        <span class="burst-star" style="--x:118px;--y:8px;--rot:-140deg;--delay:130ms;--color:#ff9f43"></span>
        <span class="burst-star" style="--x:-120px;--y:12px;--rot:160deg;--delay:80ms;--color:#ff7a93"></span>
      </div>
      <div class="success-icon" id="successIcon" data-icon="Check"></div>
      <h2 id="successTitle">欢迎回来，探险者</h2>
      <p id="successText">身份验证成功，正在进入。</p>
      <button class="success-close" type="button" id="successClose">
        继续
        <span data-icon="ArrowRight"></span>
      </button>
    </div>
  </div>

  <div class="register-overlay" id="registerOverlay" role="dialog" aria-modal="true" aria-labelledby="registerTitle" hidden>
    <div class="register-card">
      <button class="register-close" type="button" id="registerClose" aria-label="关闭">
        <span data-icon="X"></span>
      </button>
      <div class="register-head">
        <p class="eyebrow">创建账号</p>
        <h2 id="registerTitle">注册学生 / 教师账号</h2>
        <p>使用学号、工号或邮箱注册，注册后自动登录对应空间。</p>
      </div>
      <form id="registerForm" novalidate>
        <div class="role-switch register-role" role="tablist" aria-label="选择注册身份">
          <button class="role-tab active" type="button" role="tab" aria-selected="true" data-reg-role="student">
            <span data-icon="GraduationCap"></span>
            学生
          </button>
          <button class="role-tab" type="button" role="tab" aria-selected="false" data-reg-role="teacher">
            <span data-icon="Presentation"></span>
            教师
          </button>
        </div>
        <div class="field-group">
          <label class="field-label" for="regAccount">学号 / 工号 / 邮箱</label>
          <div class="field" id="regAccountField">
            <span class="field-icon" data-icon="User"></span>
            <input id="regAccount" name="regAccount" type="text" autocomplete="username" placeholder="请输入账号" required>
          </div>
          <p class="field-error" id="regAccountError" role="alert"></p>
        </div>
        <div class="field-group">
          <label class="field-label" for="regPassword">设置密码</label>
          <div class="field" id="regPasswordField">
            <span class="field-icon" data-icon="LockKeyhole"></span>
            <input id="regPassword" name="regPassword" type="password" autocomplete="new-password" placeholder="至少 6 位" required>
          </div>
          <p class="field-error" id="regPasswordError" role="alert"></p>
        </div>
        <div class="field-group">
          <label class="field-label" for="regConfirm">确认密码</label>
          <div class="field" id="regConfirmField">
            <span class="field-icon" data-icon="LockKeyhole"></span>
            <input id="regConfirm" name="regConfirm" type="password" autocomplete="new-password" placeholder="再次输入密码" required>
          </div>
          <p class="field-error" id="regConfirmError" role="alert"></p>
        </div>
        <label class="checkbox register-agree">
          <input type="checkbox" id="registerAgree" checked>
          <span class="checkmark" data-icon="Check"></span>
          <span>我已阅读并同意数据使用与隐私保护说明</span>
        </label>
        <button class="submit-btn" type="submit" id="registerSubmit">
          <span class="btn-label">注册并登录</span>
          <span class="btn-icon" data-icon="ArrowRight"></span>
          <span class="spinner" hidden></span>
        </button>
      </form>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
